name: Build Morimens portable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Extract source archive
        shell: pwsh
        run: |
          Expand-Archive -Path "Morimens-RC12.4.19-safe-login-source.zip" -DestinationPath "src" -Force

      - name: Build portable release
        shell: cmd
        working-directory: src
        run: build-portable.cmd

      - name: Upload compiled archive
        uses: actions/upload-artifact@v4
        with:
          name: MorimensPortable-win-x64
          path: src/publish/MorimensPortable-win-x64.zip
          if-no-files-found: error
